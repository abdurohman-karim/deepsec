[package]
name = "deepsec-agent"
version = "0.7.0"
edition = "2024"
description = "DeepSec — Windows-агент защиты сессий Telegram Desktop (Rust)"
publish = false

[[bin]]
name = "DeepSecAgent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
hex = "0.4"
log = "0.4"
quick-xml = "0.42"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
