[package]
name = "deepsec-agent"
version = "0.7.0"
edition = "2024"
description = "DeepSec — Windows-агент защиты сессий Telegram Desktop (Rust)"
publish = false

[[bin]]
name = "DeepSecAgent"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
# окно DeepSec: egui на OpenGL, без лишних платформ
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
jpeg-encoder = "0.7"
log = { version = "0.4", features = ["std"] }
quick-xml = "0.42"
rand = "0.10"
# ring, а не aws-lc-rs: собирается без cmake/NASM
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
# GitHub Releases и локальный канал окна; rustls с ring, корневые сертификаты — из хранилища Windows
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
