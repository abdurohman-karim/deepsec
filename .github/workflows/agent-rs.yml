name: Rust agent

# Rust-версия Windows-агента (agent-rs/) пишется рядом с Python-агентом. Пока она не догнала его по
# возможностям, CI только собирает и тестирует её — релизы и установщик по-прежнему из Python (deepsec/).
on:
  push:
    branches: [main]
    paths:
      - "agent-rs/**"
      - ".github/workflows/agent-rs.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-rs

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Binary size
        shell: pwsh
        run: "(Get-Item target/release/DeepSecAgent.exe).Length / 1MB | ForEach-Object { 'DeepSecAgent.exe: {0:N1} MB' -f $_ }"
